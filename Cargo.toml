[package]
authors = ["pleme-io"]
description = "Composition layer for the lava suite. deflava-architecture form + Rust builders. Architectures consume + return typed ResourceRef chains; downstream architectures slot into upstream outputs at composition time (not apply time). Pangea Architecture/ResourceBuilder analog."
edition = "2024"
license = "MIT"
name = "lava-arch"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-arch"
version = "0.2.3"

[lib]
name = "lava_arch"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
# ── ★ GIT DEP, NOT A VERSION ─────────────────────────────────────────
# lava-core's Import type is committed and unpublished, and a
# [patch.crates-io] does NOT reach the nix build: substrate's lockfile-builder
# re-resolves from the manifest and drops patches, so CI fetched
# lava-core-0.2.1.tar.gz from the registry while cargo locally used the patched
# source. Measured — the build failed on a missing add_import while every
# local test passed.
#
# A git dep survives that, because it is in the manifest rather than layered
# over it, and it is transitive: a consumer depending on THIS crate by git gets
# this lava-core too, which a patch never achieves.
#
# COST, stated: crates.io refuses a package with a git dependency, so this
# crate cannot be published while the line stands. Revert to a version
# requirement when lava-core ships.
lava-core = { git = "https://github.com/pleme-io/lava-core", rev = "f7530d06a52c3356d81415c6611c5ccd2c8cbd06" }
